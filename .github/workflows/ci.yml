name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run in progress. Reviewing a build for
# code that has already been replaced is wasted time and wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Runs unit tests and, because the runner has Docker, the Testcontainers
      # integration test that is skipped on a developer machine without it.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/*-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # `npm ci` rather than `install`: it fails on a lockfile that does not match
      # package.json, which is the whole point of running it here.
      - name: Install
        run: npm ci

      # The mobile equivalent of `mvnw verify`. There is no test suite yet; the type
      # checker is what catches the API contract drifting away from the backend.
      - name: Type check
        run: npm run typecheck
