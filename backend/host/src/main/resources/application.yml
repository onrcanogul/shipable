# Base configuration. Anything secret is read from the environment - see infra/.env.example.
#
# The ${VAR:default} form gives a working local default and no default at all for secrets,
# so a missing secret stops the application at startup instead of surfacing as a strange
# 500 in production.

spring:
  application:
    name: app-backend

  profiles:
    # dev and prod only. Set SPRING_PROFILES_ACTIVE; dev is the default so a fresh clone
    # runs with readable logging and the admin API available.
    default: dev

  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${APP_DB_USERNAME:app}
    password: ${APP_DB_PASSWORD:app}
    hikari:
      maximum-pool-size: ${APP_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Never `update` or `create`. Flyway owns the schema; letting Hibernate also change
      # it means two things editing the same tables and no record of who did what.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Which modules get migrated, and into which schema, is decided in
    # host/config/FlywayConfiguration - one Flyway instance per module, each with its own
    # history table. `locations` is deliberately absent: a single Flyway merges every
    # location into one version sequence, and every module here starts at V1.
    #
    # Everything else under spring.flyway.* still applies - each module's instance inherits
    # this configuration and overrides only its location and schema.
    clean-disabled: true
  data:
    redis:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
      timeout: ${APP_REDIS_TIMEOUT:2s}

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${APP_PORT:8080}
  error:
    # The error shape comes from GlobalExceptionHandler. Spring's default page would leak
    # stack traces and its own JSON format.
    whitelabel:
      enabled: false
  shutdown: graceful

app:
  core:
    rate-limit:
      permits: ${APP_RATE_LIMIT_PERMITS:120}
      window: ${APP_RATE_LIMIT_WINDOW:1m}

  identity:
    jwt:
      # No default. Generate with: openssl rand -base64 48
      secret: ${APP_JWT_SECRET}
      issuer: ${APP_JWT_ISSUER:app-backend}
      # Short: a leaked access token is only useful this long.
      access-token-ttl: ${APP_ACCESS_TOKEN_TTL:15m}
      # Long: how long someone stays signed in without opening the app.
      refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:60d}
    apple:
      bundle-ids: ${APP_APPLE_BUNDLE_IDS:}
    google:
      client-ids: ${APP_GOOGLE_CLIENT_IDS:}

  billing:
    revenue-cat:
      api-key: ${APP_REVENUECAT_API_KEY}
      api-base-url: ${APP_REVENUECAT_API_BASE_URL:https://api.revenuecat.com}
      webhook-secret: ${APP_REVENUECAT_WEBHOOK_SECRET}
      # Short: a paywall check must never hang on a third party.
      request-timeout: ${APP_REVENUECAT_TIMEOUT:5s}

  cache:
    # Off by default, so a fresh clone runs with no Redis container. Turn it on before
    # you run a second instance: in-memory rate limiting means three replicas give a
    # caller three times the limit.
    enabled: ${APP_CACHE_ENABLED:false}
    # Namespaces every key, so one Redis can serve dev and prod without them reading
    # each other's entries.
    key-prefix: ${APP_CACHE_KEY_PREFIX:app}
    default-ttl: ${APP_CACHE_DEFAULT_TTL:10m}

  config:
    default-minimum-version: ${APP_MIN_VERSION:0.0.0}
    version-gate-enabled: ${APP_VERSION_GATE_ENABLED:true}
    # How quickly a change made through the admin API reaches the other instances.
    refresh-interval: ${APP_CONFIG_REFRESH_INTERVAL:PT60S}
    settings-refresh-interval: ${APP_SETTINGS_REFRESH_INTERVAL:PT30S}

  admin:
    # The operator API can change rate limits, force every client to update and enable
    # maintenance mode. Off unless you need it; when on, the app refuses to start
    # without a key of at least 32 characters.
    enabled: ${APP_ADMIN_ENABLED:false}
    api-key: ${APP_ADMIN_API_KEY:}
    # Optional second lock. Empty means "any address with the key". Only meaningful
    # behind a proxy that sets X-Forwarded-For, which Caddy does.
    allowed-ips: ${APP_ADMIN_ALLOWED_IPS:}

  privacy:
    deletion-grace-period: ${APP_DELETION_GRACE_PERIOD:7d}

management:
  endpoints:
    web:
      exposure:
        # Keep this narrow. Actuator can expose configuration, environment variables and
        # heap dumps; behind Caddy it is reachable from the internet.
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # %X{requestId} is set by RequestContextFilter. It is what turns "a user reports a bug"
    # into "here is every line from that request".
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    dev.onrcanogul.appbackend: ${APP_LOG_LEVEL:INFO}
