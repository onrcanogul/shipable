# One app on a server that already runs the shared stack.
#
#   cd ~/my-app/infra/multi-app/app && cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#
# Just the API. Caddy, Postgres and Redis are shared and already running - see
# ../shared/. Bring that up first or this will fail to resolve them.
#
# Copy this directory per app, or keep each app in its own clone of the repo. Every app
# needs its own APP_NAME, its own database, and above all its own APP_JWT_SECRET.

name: ${APP_NAME}

services:
  api:
    build:
      # Four levels up from infra/multi-app/app is the repository root.
      context: ../../..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    # Fixed, because this is the name the shared Caddy proxies to. It must match the
    # reverse_proxy target in ../shared/Caddyfile.
    container_name: ${APP_NAME}-api
    # Required once more than one thing runs on the box: the JVM starts with
    # -XX:MaxRAMPercentage=75, and with no limit that is 75% of the HOST's memory. Two
    # apps would each plan to take three quarters of the machine.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Host is the shared Postgres container, resolved over appnet. The database and
      # user are this app's own - see create-app-database.sh.
      APP_DB_URL: ${APP_DB_URL}
      APP_DB_USERNAME: ${APP_DB_USERNAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Lower than the single-app default: every app on the box runs its own pool
      # against the same Postgres.
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-10}

      # MUST be unique per app. A shared secret means a token minted for one app is
      # accepted by every other app on this server.
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      # Second layer: tokens are validated against this issuer, so even a leaked secret
      # does not silently work across apps.
      APP_JWT_ISSUER: ${APP_JWT_ISSUER}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-60d}

      APP_APPLE_BUNDLE_IDS: ${APP_APPLE_BUNDLE_IDS:-}
      APP_GOOGLE_CLIENT_IDS: ${APP_GOOGLE_CLIENT_IDS:-}

      APP_REVENUECAT_API_KEY: ${APP_REVENUECAT_API_KEY}
      APP_REVENUECAT_API_BASE_URL: ${APP_REVENUECAT_API_BASE_URL:-https://api.revenuecat.com}
      APP_REVENUECAT_WEBHOOK_SECRET: ${APP_REVENUECAT_WEBHOOK_SECRET}
      APP_REVENUECAT_TIMEOUT: ${APP_REVENUECAT_TIMEOUT:-5s}

      # Shared Redis. The prefix is what keeps apps out of each other's keys, so it must
      # be unique per app.
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CACHE_KEY_PREFIX: ${APP_CACHE_KEY_PREFIX}
      APP_CACHE_DEFAULT_TTL: ${APP_CACHE_DEFAULT_TTL:-10m}
      APP_REDIS_HOST: ${APP_REDIS_HOST:-redis}
      APP_REDIS_PORT: ${APP_REDIS_PORT:-6379}
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
      APP_REDIS_TIMEOUT: ${APP_REDIS_TIMEOUT:-2s}

      APP_RATE_LIMIT_PERMITS: ${APP_RATE_LIMIT_PERMITS:-120}
      APP_RATE_LIMIT_WINDOW: ${APP_RATE_LIMIT_WINDOW:-1m}

      # Unique per app, or one app's admin key manages another.
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-false}
      APP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-}
      APP_ADMIN_ALLOWED_IPS: ${APP_ADMIN_ALLOWED_IPS:-}

      APP_MIN_VERSION: ${APP_MIN_VERSION:-0.0.0}
      APP_VERSION_GATE_ENABLED: ${APP_VERSION_GATE_ENABLED:-true}
      APP_DELETION_GRACE_PERIOD: ${APP_DELETION_GRACE_PERIOD:-7d}
      APP_CONFIG_REFRESH_INTERVAL: ${APP_CONFIG_REFRESH_INTERVAL:-PT60S}
      APP_SETTINGS_REFRESH_INTERVAL: ${APP_SETTINGS_REFRESH_INTERVAL:-PT30S}

      APP_PORT: 8080
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    # Loopback only, and a different port per app. Not for traffic - Caddy reaches the
    # container over appnet - but so you can SSH-tunnel to the admin API:
    #   ssh -L 8081:localhost:8081 user@server
    ports:
      - "127.0.0.1:${APP_LOCAL_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - appnet

networks:
  appnet:
    # Created by the shared stack. `external` means Compose expects it to exist rather
    # than making its own - which is what puts this container on the same network as
    # Caddy and Postgres.
    external: true
    name: appnet
