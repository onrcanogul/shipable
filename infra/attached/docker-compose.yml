# This app, attached to infrastructure it does not own.
#
#   cd infra/attached && cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#
# Just the API. No Postgres, no Redis, no reverse proxy - they already exist on the
# machine, put there by whoever runs the server, and are shared with whatever else is
# hosted alongside this app.
#
# What this app needs from that environment is written down in
# ../../docs/RUNNING-ON-A-SHARED-SERVER.md. Configuring the proxy, creating the database
# and backing it up are the server's business, not this repository's - which is why none
# of that lives here.
#
# For a machine that hosts only this app, use ../docker-compose.yml instead: it brings its
# own Postgres, and its own Caddy behind --profile standalone.

name: ${APP_NAME}

services:
  api:
    build:
      # Two levels up from infra/attached is the repository root.
      context: ../..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    # Fixed and predictable, because the reverse proxy on this machine resolves the app
    # by container name over the shared network. Whoever configures that proxy needs to
    # know this value; nothing else here depends on it.
    container_name: ${APP_NAME}-api
    # Required once more than one thing runs on the box: the JVM starts with
    # -XX:MaxRAMPercentage=75, and with no limit that is 75% of the HOST's memory. Two
    # apps would each plan to take three quarters of the machine.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Points at the Postgres already running on this machine, resolved over the shared
      # network. The database and user belong to this app alone - separate databases, not
      # separate schemas, because this template names its schemas identity, billing,
      # quota... which would collide with another app's.
      APP_DB_URL: ${APP_DB_URL}
      APP_DB_USERNAME: ${APP_DB_USERNAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Lower than the single-app default of 20, because this Postgres serves more than
      # this app and max_connections is finite.
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-10}

      # MUST be unique to this app. If anything else on this machine signs tokens with the
      # same secret, a token minted there is accepted here.
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      # Second layer: tokens are validated against this issuer, so a shared secret does
      # not silently work across applications.
      APP_JWT_ISSUER: ${APP_JWT_ISSUER}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-60d}

      APP_APPLE_BUNDLE_IDS: ${APP_APPLE_BUNDLE_IDS:-}
      APP_GOOGLE_CLIENT_IDS: ${APP_GOOGLE_CLIENT_IDS:-}

      APP_REVENUECAT_API_KEY: ${APP_REVENUECAT_API_KEY}
      APP_REVENUECAT_API_BASE_URL: ${APP_REVENUECAT_API_BASE_URL:-https://api.revenuecat.com}
      APP_REVENUECAT_WEBHOOK_SECRET: ${APP_REVENUECAT_WEBHOOK_SECRET}
      APP_REVENUECAT_TIMEOUT: ${APP_REVENUECAT_TIMEOUT:-5s}

      # The Redis on this machine is shared. This prefix is namespaced into every key this
      # app writes, and is the only thing keeping it out of anything else's keys.
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CACHE_KEY_PREFIX: ${APP_CACHE_KEY_PREFIX}
      APP_CACHE_DEFAULT_TTL: ${APP_CACHE_DEFAULT_TTL:-10m}
      APP_REDIS_HOST: ${APP_REDIS_HOST:-redis}
      APP_REDIS_PORT: ${APP_REDIS_PORT:-6379}
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
      APP_REDIS_TIMEOUT: ${APP_REDIS_TIMEOUT:-2s}

      APP_RATE_LIMIT_PERMITS: ${APP_RATE_LIMIT_PERMITS:-120}
      APP_RATE_LIMIT_WINDOW: ${APP_RATE_LIMIT_WINDOW:-1m}

      # Unique to this app, or another admin key on this machine could reconfigure it.
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-false}
      APP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-}
      APP_ADMIN_ALLOWED_IPS: ${APP_ADMIN_ALLOWED_IPS:-}

      APP_MIN_VERSION: ${APP_MIN_VERSION:-0.0.0}
      APP_VERSION_GATE_ENABLED: ${APP_VERSION_GATE_ENABLED:-true}
      APP_DELETION_GRACE_PERIOD: ${APP_DELETION_GRACE_PERIOD:-7d}
      APP_CONFIG_REFRESH_INTERVAL: ${APP_CONFIG_REFRESH_INTERVAL:-PT60S}
      APP_SETTINGS_REFRESH_INTERVAL: ${APP_SETTINGS_REFRESH_INTERVAL:-PT30S}

      APP_PORT: 8080
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    # Loopback only. Not how traffic arrives - the proxy reaches the container over the
    # shared network - but so an operator can SSH-tunnel to the admin API:
    #   ssh -L 8081:localhost:8081 user@server
    # Pick a port nothing else on the machine is using.
    ports:
      - "127.0.0.1:${APP_LOCAL_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - shared

networks:
  shared:
    # `external` means Compose expects this network to already exist rather than creating
    # one, which is what puts this container alongside the proxy and the database.
    #
    # Created by whoever set the machine up, not by this file. The name is configurable
    # because this app does not get to decide what the server calls its network.
    external: true
    name: ${APP_SHARED_NETWORK:-appnet}
